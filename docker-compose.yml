services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: aivora-backend

    restart: unless-stopped

    env_file:
      - ./server/.env

    depends_on:
      meilisearch:
        condition: service_healthy

    ports:
      - "5000:5000"

  meilisearch:
    image: getmeili/meilisearch:latest

    container_name: aivora-meilisearch

    restart: unless-stopped

    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

    volumes:
      - meilisearch_data:/meili_data

    ports:
      - "7700:7700"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:7700/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://aivora.directory
        NEXT_PUBLIC_API_URL: https://aivora.directory

    container_name: aivora-frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:5000/api
      BACKEND_INTERNAL_SECRET: ${BACKEND_INTERNAL_SECRET}

    depends_on:
      - backend

    ports:
      - "3000:3000"

volumes:
  meilisearch_data: